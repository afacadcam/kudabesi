<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Gemini AI Assistant — KudaBesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/jpeg" href="src/images/logo.jpeg">
  <link rel="stylesheet" href="src/styles/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
  <div class="chat-app">
    <div class="chat-top-nav">
      <button type="button" id="close-chat" class="nav-back-btn" title="Tutup chat">
        <span>Tutup</span>
      </button>
      <div class="model-picker">
        <label for="model-select" class="model-picker-label">
          <span class="live-dot" aria-hidden="true"></span>
          <span>Model:</span>
        </label>
        <select id="model-select" class="model-select" aria-label="Pilih model AI">
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
          <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
          <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
          <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite</option>
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          <option value="gemma-4-31b-it">Gemma 4</option>
        </select>
      </div>
    </div>

    <div class="chat-container">
      <header class="chat-header">
        <div class="gemini-header-brand">
          <div class="gemini-avatar" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4771 12 22C12 16.4771 16.4771 12 22 12C16.4771 12 12 7.52285 12 2Z"
                fill="url(#gemini-head-grad)" />
              <defs>
                <linearGradient id="gemini-head-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2563eb" />
                  <stop offset="0.5" stop-color="#7c3aed" />
                  <stop offset="1" stop-color="#db2777" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="gemini-header-text">
            <h1>Google Gemini Assistant</h1>
            <p class="subtitle">Konsultasi otomotif, rekomendasi part, dan percakapan bertenaga AI • <span
                id="active-model-badge" class="model-badge">gemini-3.5-flash-lite</span></p>
          </div>
        </div>
      </header>

      <div id="chat-box" class="chat-box"></div>

      <form id="chat-form" class="chat-input-area">
        <textarea id="user-input" rows="3"
          placeholder="Tanyakan seputar motor, mesin, part, atau topik lainnya... (Enter untuk kirim, Ctrl+Enter untuk baris baru)"
          required></textarea>
        <button type="submit" id="send-button" aria-label="Kirim Pesan" title="Kirim Pesan (Enter)">
          <i class="bi bi-send-arrow-up"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="src/scripts/chat.js"></script>
  <script>
    document.getElementById('close-chat').addEventListener('click', () => {
      if (window.parent !== window) window.parent.postMessage({ type: 'close-chat' }, window.location.origin);
      else window.location.href = 'index.html';
    });
  </script>
</body>

</html>
